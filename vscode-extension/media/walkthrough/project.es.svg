<svg xmlns="http://www.w3.org/2000/svg" width="560" height="380" viewBox="0 0 560 380" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13">
  <title>Página principal de Spec2Test: proyecto, zona de arrastre y Process</title>
  <rect width="560" height="380" rx="8" fill="#1e1e1e"/>
  <rect x="20" y="20" width="300" height="340" rx="6" fill="#252526" stroke="#3c3c3c"/>
  <rect x="32" y="32" width="124" height="26" rx="4" fill="#3c3c3c" stroke="#d9822b" stroke-width="2"/>
  <text x="42" y="50" fill="#cccccc">shop-app  ▾</text>
  <rect x="164" y="32" width="26" height="26" rx="4" fill="#3c3c3c" stroke="#d9822b" stroke-width="2"/>
  <text x="172" y="51" fill="#cccccc" font-size="16">+</text>
  <rect x="270" y="32" width="38" height="26" rx="4" fill="#3c3c3c"/>
  <text x="278" y="50" fill="#cccccc">⚙</text>
  <text x="34" y="82" fill="#9d9d9d" font-size="11">…/shop-app/specs</text>
  <rect x="280" y="68" width="28" height="22" rx="4" fill="#3c3c3c" stroke="#d9822b" stroke-width="2"/>
  <text x="288" y="84" fill="#cccccc">⋮</text>
  <rect x="32" y="102" width="276" height="50" rx="4" fill="#2d2d30" stroke="#d9822b" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="68" y="132" fill="#9d9d9d">Drop files (arrastra aquí)</text>
  <rect x="32" y="166" width="90" height="26" rx="4" fill="#3c3c3c"/>
  <text x="42" y="184" fill="#cccccc">Add files…</text>
  <rect x="208" y="166" width="100" height="26" rx="4" fill="#0e639c" stroke="#d9822b" stroke-width="2"/>
  <text x="226" y="184" fill="#ffffff">▶ Process</text>
  <rect x="32" y="204" width="276" height="62" rx="4" fill="#2d2d30" stroke="#3c3c3c"/>
  <text x="44" y="226" fill="#cccccc" font-weight="600">checkout-flow.mp4</text>
  <rect x="44" y="238" width="160" height="6" rx="3" fill="#3c3c3c"/><rect x="44" y="238" width="96" height="6" rx="3" fill="#3fb950"/>
  <text x="44" y="258" fill="#9d9d9d" font-size="11">Original · Pre-processed · Result</text>
  <rect x="32" y="274" width="276" height="62" rx="4" fill="#2d2d30" stroke="#3c3c3c"/>
  <text x="44" y="296" fill="#cccccc" font-weight="600">requirements.pdf</text>
  <text x="44" y="318" fill="#9d9d9d" font-size="11">Processed</text>
  <g fill="#d9822b"><circle cx="100" cy="22" r="12"/><circle cx="177" cy="22" r="12"/><circle cx="294" cy="100" r="12"/><circle cx="258" cy="154" r="12"/><circle cx="296" cy="236" r="12"/></g>
  <g fill="#fff" font-weight="700" text-anchor="middle"><text x="100" y="27">1</text><text x="177" y="27">2</text><text x="294" y="105">3</text><text x="258" y="159">5</text><text x="296" y="241">6</text></g>
  <circle cx="320" cy="127" r="12" fill="#d9822b"/><text x="320" y="132" fill="#fff" font-weight="700" text-anchor="middle">4</text>
  <text x="344" y="50" fill="#cccccc" font-weight="600">1  Lista de proyectos</text>
  <text x="344" y="68" fill="#9d9d9d">cambia de proyecto</text>
  <text x="344" y="94" fill="#cccccc" font-weight="600">2  Nuevo proyecto</text>
  <text x="344" y="112" fill="#9d9d9d">nombre, carpeta de inputs,</text>
  <text x="344" y="128" fill="#9d9d9d">carpeta de features</text>
  <text x="344" y="154" fill="#cccccc" font-weight="600">3  Menú del proyecto ⋮</text>
  <text x="344" y="172" fill="#9d9d9d">abrir/cambiar carpetas</text>
  <text x="344" y="196" fill="#cccccc" font-weight="600">4  Zona de arrastre</text>
  <text x="344" y="214" fill="#9d9d9d">arrastra desde Finder o</text>
  <text x="344" y="230" fill="#9d9d9d">el Explorador de VS Code</text>
  <text x="344" y="256" fill="#cccccc" font-weight="600">5  Process</text>
  <text x="344" y="274" fill="#9d9d9d">archivos nuevos y cambiados</text>
  <text x="344" y="300" fill="#cccccc" font-weight="600">6  Tarjeta de archivo</text>
  <text x="344" y="318" fill="#9d9d9d">progreso en vivo y botones</text>
  <text x="344" y="334" fill="#9d9d9d">para abrir los resultados</text>
