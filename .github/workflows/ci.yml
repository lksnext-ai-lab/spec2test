name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

# A newer push replaces the run of the same branch, except on main: every merge keeps its own analysis.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  input-processor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            input-processor/requirements.txt
            requirements-dev.txt
      # The suite does not need the heavy runtime packages (they are imported
      # lazily), but langchain-core must be present: see requirements-dev.txt.
      - run: pip install -r requirements-dev.txt langchain-core "mcp>=1.9,<2"
      - run: PYTHONPATH=src python -m pytest -q
        working-directory: input-processor

  web-crawler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Same pins as web-crawler/Dockerfile; no browser and no network needed.
      - run: pip install pytest uvicorn "mcp[cli]>=1.9.1,<2" "crawl4ai==0.9.4"
      - run: python -m pytest web-crawler/tests -q

  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Restored from the former "Build" workflow: coverage for both suites, then the SonarQube scan
  # (sonar-project.properties lists the sources and the coverage reports). It needs the SONAR_TOKEN
  # secret, so it runs for pull requests of this repository and for main, not for every branch push.
  sonarqube:
    name: SonarQube
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - name: Extension tests with coverage
        working-directory: vscode-extension
        run: |
          npm ci
          npm test -- --coverage
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt langchain-core "mcp>=1.9,<2"
      - name: Run tests with coverage
        run: python -m pytest input-processor/tests --cov --cov-report=xml:coverage.xml
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
