name: Gherkin-Generator

services:
  crawler:
    container_name: web-crawler
    build:
      context: ./web-crawler
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./web-crawler/src:/app/src
      - ./auth_actions.json:/app/auth_actions.json
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - spec2test-network

  input-processor:
    container_name: input_processor
    build:
      context: ./input-processor
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "8003:8000"
    # Project folders come from docker-compose.override.yaml (see
    # 'python scripts/sync_projects.py').
    volumes:
      - ./input-processor/src:/app/src
    environment:
      - PYTHONUNBUFFERED=1
      - HF_HOME=/root/.cache/huggingface
      - HF_HUB_ENABLE_HF_TRANSFER=1
      - HF_TOKEN=${HF_TOKEN:-}
    command: python /app/src/main.py
    networks:
      - spec2test-network

networks:
  spec2test-network:
    name: spec2test-network
    driver: bridge