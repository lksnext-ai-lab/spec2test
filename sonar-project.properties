sonar.projectKey=lks-ot-i-plus-d_spec2test-public
sonar.organization=lks-ot-i-plus-d
sonar.sources=input-processor/src,web-crawler/src,vscode-extension/src,vscode-extension/webview-ui
sonar.tests=vscode-extension/test

# Coverage reports: the input-processor one is produced by pytest-cov in the
# build workflow, the web-crawler one is checked in (see web-crawler/README.md).
sonar.python.coverage.reportPaths=coverage.xml,web-crawler/tests/coverage.xml

# The extension's lcov report is produced by vitest in the build workflow.
sonar.javascript.lcov.reportPaths=vscode-extension/coverage/lcov.info

sonar.exclusions=vscode-extension/node_modules/**,vscode-extension/dist/**,.venv/**,**/__pycache__/**,.sonar/**
